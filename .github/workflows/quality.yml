name: Witch Dog quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python regression and source checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Compile tools
        run: python -m compileall -q tools
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test web CLI without target access
        run: python tools/web_baseline.py --help
      - name: Validate initial public data
        run: python tools/validate_intel.py --file data/intel/latest.json
