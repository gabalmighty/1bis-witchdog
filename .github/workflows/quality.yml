name: Witch Dog quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python regression and source checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Compile tools
        run: python -m compileall -q tools
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test web CLI without target access
        run: python tools/web_baseline.py --help
      - name: Compile VAPT CLI and perform offline help checks
        run: |
          python tools/vapt.py --help
          python tools/vapt_authz.py --help
          python tools/vapt_report.py --help
      - name: Validate initial public data
        run: python tools/validate_intel.py --file data/intel/latest.json

  review-action-smoke:
    name: Composite Action read-only smoke
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Witch Dog composite no AI and no publish
        uses: ./
        with:
          enable-ai: 'false'
          publish-comment: 'false'
          policy-ref: main
