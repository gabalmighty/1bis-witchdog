name: Witch Dog public threat intelligence

on:
  schedule:
    # 08:23 and 20:23 Asia/Manila; schedules are UTC and not guaranteed exact
    - cron: "23 0,12 * * *"
  workflow_dispatch:

concurrency:
  group: witchdog-public-intel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    name: Read-only trusted-feed ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Parser regression tests
        run: python -m unittest discover -s tests -v
      - name: Ingest Cloudflare Zero Wire and CISA KEV
        run: python tools/intel_sync.py --out data/intel/latest.json
      - name: Enforce strict schema
        run: python tools/validate_intel.py --file data/intel/latest.json
      - name: Save public JSON only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-intel-json
          path: data/intel/latest.json
          if-no-files-found: error
          retention-days: 2

  propose:
    name: Open a reviewed data PR
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: public-intel-json
          path: data/intel
      - name: Validate untrusted JSON before any write
        run: python tools/validate_intel.py --file data/intel/latest.json
      - name: Propose reviewed intelligence update
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: data/intel/latest.json
          branch: bot/public-intel-refresh
          base: main
          delete-branch: true
          commit-message: "data: update normalized public advisories"
          title: "data: refresh Cloudflare Zero Wire and CISA KEV"
          body: |
            Deterministic public-feed ingestion only; no client assets or AI-generated executable code.
            Verify dates, source links, aliases, and applicability before merging.
            No automatic merge or deployment.
